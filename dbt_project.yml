# --- THE STORY OF THIS PROJECT ---
# Welcome to the Control Center of the Credit Risk Analytics Engine.
# This file acts as the ultimate blueprint, governing how data transforms from raw financial noise 
# into audit-ready, regulatory-compliant data models.
#
# It divides our analytical landscape into three distinct execution rings:
#   1. STAGING (Prepared View): The strict gatekeeper that normalizes incoming transactions.
#   2. INTERMEDIATE (Prepared View): The risk calculation engine computing complex metrics (EAD, PD, LGD, Concentration).
#   3. MARTS (Curated Table): The business-facing dimensional layer built for reporting performance.
#
# By leveraging dynamic target routing, this configuration automatically manages environment promotion, 
# seamlessly shifting between DEV, UAT, and PROD databases based on who or what triggers the run.

name: 'credit_risk_analytics'
version: '1.0.0'
config-version: 2

profile: 'credit_risk_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  credit_risk_analytics:
    # Staging Layer: Cleanses, casts data formats, maps schemas
    staging:
      +materialized: view
      +database: "{{ 'BANKING_PROD_DB' if target.name == 'prod' else 'BANKING_UAT_DB' if target.name == 'uat' else 'BANKING_DEV_DB' }}"
      +schema: PREPARED

    # Intermediate Layer: Complex banking math (Credit Risk metrics like EAD, PD, LGD)
    intermediate:
      +materialized: view
      +database: "{{ 'BANKING_PROD_DB' if target.name == 'prod' else 'BANKING_UAT_DB' if target.name == 'uat' else 'BANKING_DEV_DB' }}"
      +schema: PREPARED

    # Marts Layer: Dimensional modeling (10 Dimensions, 1 Fact) for Business & Regulatory reports
    marts:
      +materialized: table
      +database: "{{ 'BANKING_PROD_DB' if target.name == 'prod' else 'BANKING_UAT_DB' if target.name == 'uat' else 'BANKING_DEV_DB' }}"
      +schema: CURATED

  # Package Models: Aligned with credit_risk_analytics under the main models key
  dbt_project_evaluator:
    +schema: PROJECT_EVALUATOR

vars:
  # The orchestrator will pass a real UUID at runtime (e.g., dbt run --vars "{'orchestrator_run_id': 'abc-123'}")
  # If running locally, it defaults gracefully to 'LOCAL_DEV_BATCH'
  orchestrator_run_id: 'LOCAL_DEV_BATCH'

seeds:
  credit_risk_analytics:
    +schema: RAW