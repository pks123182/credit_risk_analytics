version: 2

sources:
  - name: banking_raw
    description: |
      --- THE STORY OF THIS SOURCE ---
      Welcome to the absolute origin point of our credit risk ecosystem. This source block defines the landing 
      zone where raw, unvarnished financial data streams in from the outside world. It aggregates transactional 
      and operational metrics from core core banking backends, external credit bureaus, trading desks, 
      and global economic indicators. 
      
      Because this data is raw, it is inherently unpredictable. It represents the unchecked heartbeat of the bank's 
      daily lending and trading activities. 
      
      By clearly documenting and assigning primary key checks right here at the source boundary, we create an 
      indispensable contract with our upstream infrastructure teams. It ensures we catch malformed replication loads, 
      duplicate records, or extraction failures before they ever touch our warehouse transformations.
    database: BANKING_DEV_DB
    schema: RAW
    tables:
      - name: customer_loans
        description: "Core table tracking active loan accounts, original balances, and internal risk grades."
        columns:
          - name: loan_id
            description: "Primary key for the loan contract."
            tests:
              - unique
              - not_null

      - name: customer_risk_profiles
        description: "Credit bureau standings and customer internal risk metrics."
        columns:
          - name: customer_id
            description: "Primary key tracking the individual borrower."
            tests:
              - unique
              - not_null

      - name: collateral_valuations
        description: "Secured asset valuations used to mitigate LGD calculations."
        columns:
          - name: collateral_id
            description: "Primary key for the collateral instrument."
            tests:
              - unique
              - not_null

      - name: market_derivatives
        description: "Trading desk derivative exposures for counterparty credit calculations."
        columns:
          - name: contract_id
            description: "Primary key for the financial derivative contract."
            tests:
              - unique
              - not_null

      - name: macroeconomic_indicators
        description: "External annualized metrics used to calibrate baseline probability of default vectors."