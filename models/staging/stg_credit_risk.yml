version: 2

models:
  - name: stg_customer_risk_profiles
    description: "Staging view for customer credit dimensions, internal risk grades, and counterparty tracking."
    columns:
      - name: customer_id
        description: "The unique primary key for the customer."
        tests:
          - unique
          - not_null

      - name: counterparty_id
        description: "The identifier for the linked financial counterparty."
        tests:
          - not_null

      - name: counterparty_type
        description: "The standardized category of the counterparty."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CORPORATE', 'RETAIL', 'SOVEREIGN']

      - name: credit_score
        description: "The numeric credit score mapped to an integer."
        tests:
          - not_null

      - name: internal_risk_grade
        description: "The internal risk grading assigned by the bank's underwriting system."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['INVESTMENT_GRADE', 'SUBSTANDARD', 'DOUBTFUL', 'HIGH_QUALITY', 'WATCH_LIST']